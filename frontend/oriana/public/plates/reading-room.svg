<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <title>The reading room, after dusk</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c221c"/>
      <stop offset="1" stop-color="#1a1411"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241d2b"/>
      <stop offset=".7" stop-color="#3a2a2c"/>
      <stop offset="1" stop-color="#5a3d2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6d98f" stop-opacity=".75"/>
      <stop offset=".35" stop-color="#c9a962" stop-opacity=".28"/>
      <stop offset="1" stop-color="#c9a962" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c56a"/>
      <stop offset="1" stop-color="#a8742a"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3e2c"/>
      <stop offset="1" stop-color="#3b2a1f"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#wall)"/>

  <!-- Arched window -->
  <path d="M112 334V176a88 88 0 0 1 176 0v158Z" fill="url(#sky)"/>
  <g fill="#e8dfd4">
    <circle cx="150" cy="150" r="1.4" opacity=".9"/>
    <circle cx="176" cy="118" r="1" opacity=".7"/>
    <circle cx="214" cy="104" r="1.6" opacity=".9"/>
    <circle cx="262" cy="196" r="1.1" opacity=".7"/>
    <circle cx="138" cy="214" r="1.2" opacity=".6"/>
    <circle cx="170" cy="252" r=".9" opacity=".6"/>
    <circle cx="268" cy="250" r="1.3" opacity=".8"/>
    <circle cx="232" cy="290" r=".9" opacity=".5"/>
  </g>
  <circle cx="246" cy="140" r="19" fill="#efe4cf"/>
  <circle cx="254" cy="133" r="17" fill="#2a2130"/>
  <g fill="none" stroke="#c9a962" stroke-width="3">
    <path d="M200 90v244M112 228h176"/>
  </g>
  <path d="M112 334V176a88 88 0 0 1 176 0v158" fill="none" stroke="#4a3f35" stroke-width="10"/>
  <path d="M112 334V176a88 88 0 0 1 176 0v158" fill="none" stroke="#c9a962" stroke-width="2"/>
  <rect x="96" y="334" width="208" height="12" rx="2" fill="#3d332b"/>

  <!-- Lamplight -->
  <circle cx="122" cy="356" r="120" fill="url(#glow)"/>

  <!-- Table -->
  <rect x="28" y="404" width="344" height="16" rx="2" fill="url(#table)"/>
  <rect x="52" y="420" width="12" height="80" fill="#2e2119"/>
  <rect x="336" y="420" width="12" height="80" fill="#2e2119"/>

  <!-- Books -->
  <rect x="190" y="384" width="96" height="20" rx="2" fill="#8b2635"/>
  <rect x="198" y="366" width="82" height="18" rx="2" fill="#5a4636"/>
  <rect x="194" y="350" width="74" height="16" rx="2" fill="#3d332b"/>
  <g stroke="#c9a962" stroke-width="1.2" opacity=".8">
    <path d="M200 394h76M206 375h66M202 358h58"/>
  </g>

  <!-- Open book -->
  <path d="M292 404l30-12 34 6 -2 6Z" fill="#d8cbb6"/>
  <path d="M292 404l-4-10 34-4 0 2Z" fill="#e8dfd4"/>

  <!-- Lamp -->
  <ellipse cx="122" cy="402" rx="24" ry="5" fill="#b8953f"/>
  <rect x="119" y="352" width="6" height="50" fill="#c9a962"/>
  <path d="M96 352h52l-12-34h-28Z" fill="url(#shade)"/>
  <ellipse cx="122" cy="352" rx="26" ry="4" fill="#f6d98f" opacity=".85"/>
</svg>
