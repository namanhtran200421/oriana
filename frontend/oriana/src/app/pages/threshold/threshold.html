<main class="threshold" [class.is-opening]="opening()">
  <!-- A little world turning slowly behind the title; dirt, where it cannot be drawn. -->
  <div class="threshold__world" [class.is-drawn]="drawn()" aria-hidden="true">
    @if (drawn()) {
      <canvas #panorama class="threshold__canvas"></canvas>
    }
  </div>
  <app-music-toggle class="threshold__music reveal" style="--d: 8" />

  <section class="threshold__frame" aria-labelledby="threshold-title">
    <div class="threshold__words">
      <div class="threshold__logo reveal" style="--d: 1">
        <h1 id="threshold-title" class="threshold__title">{{ site.title }}</h1>
        <p class="threshold__splash" aria-hidden="true">{{ splash() }}</p>
      </div>
      <p class="threshold__tagline reveal" style="--d: 2">{{ site.tagline }}</p>
    </div>

    <button
      type="button"
      class="threshold__seal reveal"
      style="--d: 4"
      [attr.aria-label]="labels.openTheSeal"
      [attr.aria-disabled]="opening()"
      (click)="breakSeal()"
    >
      <span class="threshold__mount">
        <app-wax-seal [size]="sealSize" [monogram]="site.monogram" [broken]="opening()" />
      </span>
      <span class="threshold__cta btn btn--primary btn--lg">{{ labels.openMe }}</span>
    </button>
  </section>

  <p class="threshold__corner threshold__corner--start reveal" style="--d: 6">
    {{ labels.exLibris }} · {{ site.year | roman }}
  </p>
  <p class="threshold__corner threshold__corner--end reveal" style="--d: 6">
    {{ play.fromWithLove(site.preface.signature) }}
  </p>
</main>
