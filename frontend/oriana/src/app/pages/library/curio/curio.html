@switch (kind()) {
  @case ('bookend') {
    <span class="bookend"></span>
  }
  @case ('inkwell') {
    <span class="inkwell">
      <svg viewBox="0 0 46 150" focusable="false">
        <defs>
          <linearGradient id="ink-glass" x1="0" x2="1">
            <stop offset="0" stop-color="#0b1016" />
            <stop offset="0.35" stop-color="#26303a" />
            <stop offset="0.6" stop-color="#121820" />
            <stop offset="1" stop-color="#06090c" />
          </linearGradient>
          <linearGradient id="ink-brass" x1="0" x2="1">
            <stop offset="0" stop-color="#7a5a24" />
            <stop offset="0.45" stop-color="#e2c27a" />
            <stop offset="1" stop-color="#6d4f1c" />
          </linearGradient>
        </defs>
        <g class="inkwell__quill">
          <path d="M23 108 C25 80 30 40 37 4" fill="none" stroke="#cbb994" stroke-width="1.1" />
          <path
            d="M37 4 C26 18 21 46 24 92 C27 66 31 36 37 4 Z"
            fill="#e7dcc4"
            fill-opacity="0.92"
          />
          <path
            d="M37 4 C43 20 39 50 27 88 C31 62 35 34 37 4 Z"
            fill="#d4c6a7"
            fill-opacity="0.85"
          />
          <path
            d="M27 30 L33 26 M26 40 L32 35 M25 50 L31 44 M25 60 L30 54 M25 70 L29 64"
            stroke="#a8977a"
            stroke-width="0.5"
          />
        </g>
        <rect x="14" y="102" width="18" height="9" rx="2" fill="url(#ink-brass)" />
        <path
          d="M8 114 Q8 110 14 110 L32 110 Q38 110 38 114 L40 142 Q40 148 34 148 L12 148 Q6 148 6 142 Z"
          fill="url(#ink-glass)"
        />
        <path
          d="M11 118 L12 140"
          stroke="#fff"
          stroke-opacity="0.18"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </span>
  }
  @case ('hourglass') {
    <button
      type="button"
      class="hourglass"
      tabindex="-1"
      [attr.data-cursor]="labels.turnOver"
      (click)="flip()"
    >
      <svg #glass class="hourglass__glass" viewBox="0 0 42 100" focusable="false">
        <defs>
          <linearGradient id="hg-brass" x1="0" x2="1">
            <stop offset="0" stop-color="#6d4f1c" />
            <stop offset="0.5" stop-color="#e2c27a" />
            <stop offset="1" stop-color="#6d4f1c" />
          </linearGradient>
        </defs>
        <path
          class="hourglass__bulbs"
          d="M9 8 C9 30 19 40 19.5 50 C19 60 9 70 9 92 L33 92 C33 70 23 60 22.5 50 C23 40 33 30 33 8 Z"
        />
        <path
          class="hourglass__sand hourglass__sand--top"
          d="M11 24 C14 35 19 43 21 49.5 C23 43 28 35 31 24 Z"
        />
        <path
          class="hourglass__sand hourglass__sand--bottom"
          d="M10.5 91.5 C13 80 18 73 21 71.5 C24 73 29 80 31.5 91.5 Z"
        />
        <line class="hourglass__stream" x1="21" y1="50" x2="21" y2="91" />
        <rect x="2" y="2" width="38" height="6" rx="1.6" fill="url(#hg-brass)" />
        <rect x="2" y="92" width="38" height="6" rx="1.6" fill="url(#hg-brass)" />
        <rect x="4.5" y="8" width="2.4" height="84" fill="url(#hg-brass)" />
        <rect x="35.1" y="8" width="2.4" height="84" fill="url(#hg-brass)" />
      </svg>
    </button>
  }
  @case ('stack') {
    <span class="stack">
      <span class="stack__book stack__book--1"></span>
      <span class="stack__book stack__book--2"></span>
      <span class="stack__book stack__book--3"></span>
    </span>
  }
  @case ('reserved') {
    <span class="reserved">
      <span class="reserved__ghost" aria-hidden="true">
        <span></span><span></span><span></span>
      </span>
      <span class="reserved__card">{{ labels.reserved }}</span>
    </span>
  }
}
