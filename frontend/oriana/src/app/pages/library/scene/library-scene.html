<div class="scene__hall">
  <svg class="hall" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" focusable="false">
    <defs>
      <linearGradient id="hall-wall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0f0b09" />
        <stop offset="0.6" stop-color="#1a130f" />
        <stop offset="1" stop-color="#0c0806" />
      </linearGradient>
      <linearGradient id="hall-night" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0a1326" />
        <stop offset="0.55" stop-color="#13213f" />
        <stop offset="1" stop-color="#18284a" />
      </linearGradient>
      <radialGradient id="hall-moonglow">
        <stop offset="0" stop-color="#dfe6ff" stop-opacity="0.55" />
        <stop offset="0.4" stop-color="#9fb2e0" stop-opacity="0.16" />
        <stop offset="1" stop-color="#9fb2e0" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="hall-wood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2b1b11" />
        <stop offset="1" stop-color="#170e09" />
      </linearGradient>
      <pattern id="hall-quarry" width="30" height="46" patternUnits="userSpaceOnUse">
        <path
          d="M0 0 L30 46 M30 0 L0 46"
          stroke="#0b0806"
          stroke-width="1.4"
          stroke-opacity="0.8"
        />
      </pattern>
      <mask id="hall-crescent">
        <rect width="1600" height="1000" fill="#fff" />
        <circle
          [attr.cx]="window.moon.cx + 11"
          [attr.cy]="window.moon.cy - 7"
          [attr.r]="window.moon.r - 3"
          fill="#000"
        />
      </mask>
      <linearGradient id="hall-floor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0c0806" stop-opacity="0" />
        <stop offset="1" stop-color="#0c0806" stop-opacity="0.9" />
      </linearGradient>
    </defs>
    <rect width="1600" height="1000" fill="url(#hall-wall)" />
    <path [attr.d]="window.outer" fill="#0d0a08" />
    <path [attr.d]="window.glass" fill="url(#hall-night)" />
    <circle
      [attr.cx]="window.moon.cx"
      [attr.cy]="window.moon.cy"
      r="120"
      fill="url(#hall-moonglow)"
    />
    <circle
      [attr.cx]="window.moon.cx"
      [attr.cy]="window.moon.cy"
      [attr.r]="window.moon.r"
      fill="#efe7cf"
      mask="url(#hall-crescent)"
    />
    <path [attr.d]="window.glass" fill="url(#hall-quarry)" />
    <path [attr.d]="window.sill" fill="#1f1713" />
    <path [attr.d]="hall.wood" fill="url(#hall-wood)" />
    @for (book of hall.books; track book.color) {
      <path [attr.d]="book.d" [attr.fill]="book.color" />
    }
    <path [attr.d]="hall.gilt" fill="#6a5228" />
    <path
      [attr.d]="hall.ladder"
      fill="none"
      stroke="#2c1c12"
      stroke-width="7"
      stroke-linecap="round"
    />
    <!-- The far shelves sit in shadow; the lantern brings them back. -->
    <path d="M0 0H604V1000H0Z M996 0H1600V1000H996Z" fill="#0b0705" fill-opacity="0.5" />
    <rect y="620" width="1600" height="380" fill="url(#hall-floor)" />
  </svg>

  <svg
    class="hall hall--sky"
    viewBox="0 0 1600 1000"
    preserveAspectRatio="xMidYMid slice"
    focusable="false"
  >
    @for (star of hall.stars; track $index) {
      <circle
        class="star"
        [attr.cx]="star.x"
        [attr.cy]="star.y"
        [attr.r]="star.r"
        [style.animation-delay.s]="-star.delay"
      />
    }
    <g fill="none" stroke="#120e0b" stroke-linecap="round">
      <path [attr.d]="window.tracery" stroke-width="9" />
      <circle
        [attr.cx]="window.rose.cx"
        [attr.cy]="window.rose.cy"
        [attr.r]="window.rose.r"
        stroke-width="8"
      />
      @for (petal of rosette; track $index) {
        <circle [attr.cx]="petal.x" [attr.cy]="petal.y" [attr.r]="petal.r" stroke-width="4" />
      }
      <path [attr.d]="window.glass" stroke-width="6" />
    </g>
  </svg>

  <svg
    class="hall hall--beams"
    viewBox="0 0 1600 1000"
    preserveAspectRatio="xMidYMid slice"
    focusable="false"
  >
    <defs>
      <linearGradient id="hall-beam" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#b8c8f0" stop-opacity="0.2" />
        <stop offset="0.55" stop-color="#b8c8f0" stop-opacity="0.07" />
        <stop offset="1" stop-color="#b8c8f0" stop-opacity="0" />
      </linearGradient>
      <filter id="hall-soften" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="12" />
      </filter>
    </defs>
    <g filter="url(#hall-soften)">
      @for (beam of beams; track $index) {
        <path [attr.d]="beam" fill="url(#hall-beam)" />
      }
    </g>
  </svg>
</div>

<div #lantern class="scene__lantern"></div>

<canvas #motes class="scene__motes"></canvas>
