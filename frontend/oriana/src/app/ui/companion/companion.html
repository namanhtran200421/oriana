<div
  class="bubble"
  aria-live="polite"
  [class.is-shown]="mood() !== 'idle'"
  [attr.inert]="mood() === 'idle' ? '' : null"
>
  <p class="bubble__name">{{ name }}</p>
  <p class="bubble__words">{{ words() }}</p>
  @if (withLocket()) {
    <button type="button" class="bubble__action" (click)="openLocket($event)">
      {{ labels.openLocket }} <span aria-hidden="true">›</span>
    </button>
  }
  <button type="button" class="bubble__close" [attr.aria-label]="close" (click)="hush()">×</button>
</div>

<button
  type="button"
  class="cat"
  data-no-sparkle
  [attr.aria-label]="labels.catLabel(name)"
  (click)="tap()"
>
  <svg
    class="cat__art"
    viewBox="0 0 80 100"
    shape-rendering="crispEdges"
    aria-hidden="true"
    focusable="false"
  >
    <g class="cat__head">
      <g class="cat__ear cat__ear--left">
        <rect x="10" y="10" width="5" height="5" fill="#d79a5a" />
        <rect x="15" y="10" width="5" height="5" fill="#efe3d0" />
        <rect x="10" y="15" width="5" height="5" fill="#d79a5a" />
        <rect x="15" y="15" width="10" height="5" fill="#efe3d0" />
        <rect x="10" y="20" width="5" height="5" fill="#efe3d0" />
        <rect x="15" y="20" width="5" height="5" fill="#e8a3b0" />
        <rect x="20" y="20" width="10" height="5" fill="#efe3d0" />
        <rect x="10" y="25" width="5" height="5" fill="#efe3d0" />
        <rect x="15" y="25" width="10" height="5" fill="#e8a3b0" />
        <rect x="25" y="25" width="5" height="5" fill="#efe3d0" />
      </g>
      <g class="cat__ear cat__ear--right">
        <rect x="55" y="10" width="10" height="5" fill="#efe3d0" />
        <rect x="50" y="15" width="5" height="5" fill="#efe3d0" />
        <rect x="55" y="15" width="5" height="5" fill="#e8a3b0" />
        <rect x="60" y="15" width="5" height="5" fill="#efe3d0" />
        <rect x="45" y="20" width="10" height="5" fill="#efe3d0" />
        <rect x="55" y="20" width="5" height="5" fill="#e8a3b0" />
        <rect x="60" y="20" width="5" height="5" fill="#efe3d0" />
        <rect x="45" y="25" width="5" height="5" fill="#efe3d0" />
        <rect x="50" y="25" width="10" height="5" fill="#e8a3b0" />
        <rect x="60" y="25" width="5" height="5" fill="#efe3d0" />
      </g>
      <rect x="5" y="30" width="65" height="5" fill="#efe3d0" />
      <rect x="5" y="35" width="70" height="5" fill="#efe3d0" />
      <rect x="0" y="40" width="80" height="5" fill="#efe3d0" />
      <rect x="0" y="45" width="80" height="5" fill="#efe3d0" />
      <rect x="0" y="50" width="80" height="5" fill="#efe3d0" />
      <rect x="0" y="55" width="80" height="5" fill="#efe3d0" />
      <rect x="0" y="60" width="80" height="5" fill="#efe3d0" />
      <rect x="5" y="65" width="20" height="5" fill="#efe3d0" />
      <rect x="25" y="65" width="30" height="5" fill="#f8f0e4" />
      <rect x="55" y="65" width="20" height="5" fill="#efe3d0" />
      <rect x="5" y="70" width="15" height="5" fill="#efe3d0" />
      <rect x="20" y="70" width="40" height="5" fill="#f8f0e4" />
      <rect x="60" y="70" width="15" height="5" fill="#efe3d0" />
      <rect x="10" y="75" width="60" height="5" fill="#efe3d0" />
      <rect x="15" y="80" width="50" height="5" fill="#efe3d0" />
      <g class="cat__eyes">
        <rect x="15" y="45" width="10" height="5" fill="#2b1d14" />
        <rect x="50" y="45" width="10" height="5" fill="#2b1d14" />
        <rect x="15" y="50" width="5" height="5" fill="#2b1d14" />
        <rect x="20" y="50" width="5" height="5" fill="#ffffff" />
        <rect x="50" y="50" width="5" height="5" fill="#2b1d14" />
        <rect x="55" y="50" width="5" height="5" fill="#ffffff" />
      </g>
      <g class="cat__happy">
        <rect x="20" y="45" width="5" height="5" fill="#2b1d14" />
        <rect x="55" y="45" width="5" height="5" fill="#2b1d14" />
        <rect x="15" y="50" width="5" height="5" fill="#2b1d14" />
        <rect x="25" y="50" width="5" height="5" fill="#2b1d14" />
        <rect x="50" y="50" width="5" height="5" fill="#2b1d14" />
        <rect x="60" y="50" width="5" height="5" fill="#2b1d14" />
      </g>
      <g class="cat__blush">
        <rect x="5" y="55" width="5" height="5" fill="#e8a3b0" />
        <rect x="70" y="55" width="5" height="5" fill="#e8a3b0" />
        <rect x="5" y="60" width="5" height="5" fill="#e8a3b0" />
        <rect x="70" y="60" width="5" height="5" fill="#e8a3b0" />
      </g>
      <rect x="35" y="55" width="10" height="5" fill="#d98a98" />
      <g class="cat__mouth">
        <rect x="30" y="60" width="5" height="5" fill="#6f5c48" />
        <rect x="45" y="60" width="5" height="5" fill="#6f5c48" />
        <rect x="35" y="65" width="10" height="5" fill="#6f5c48" />
      </g>
    </g>

    <g class="cat__paws">
      <rect x="10" y="85" width="15" height="5" fill="#efe3d0" />
      <rect x="55" y="85" width="15" height="5" fill="#efe3d0" />
      <rect x="5" y="90" width="25" height="5" fill="#efe3d0" />
      <rect x="50" y="90" width="25" height="5" fill="#efe3d0" />
      <rect x="5" y="95" width="5" height="5" fill="#efe3d0" />
      <rect x="10" y="95" width="5" height="5" fill="#d8c8b0" />
      <rect x="15" y="95" width="5" height="5" fill="#efe3d0" />
      <rect x="20" y="95" width="5" height="5" fill="#d8c8b0" />
      <rect x="25" y="95" width="5" height="5" fill="#efe3d0" />
      <rect x="50" y="95" width="5" height="5" fill="#efe3d0" />
      <rect x="55" y="95" width="5" height="5" fill="#d8c8b0" />
      <rect x="60" y="95" width="5" height="5" fill="#efe3d0" />
      <rect x="65" y="95" width="5" height="5" fill="#d8c8b0" />
      <rect x="70" y="95" width="5" height="5" fill="#efe3d0" />
    </g>
  </svg>

  @for (heart of hearts(); track heart) {
    <span class="cat__heart" aria-hidden="true"></span>
  }
</button>
